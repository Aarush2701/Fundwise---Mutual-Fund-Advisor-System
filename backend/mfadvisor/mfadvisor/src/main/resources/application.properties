spring.application.name=mfadvisor
spring.datasource.url=${DB_URL}
#spring.datasource.username=root
#spring.datasource.password=0000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.client.registration.google.redirect-uri=https://fundwise-mutual-fund-advisor-system-8w4f.onrender.com/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${ID}
spring.security.oauth2.client.registration.google.client-secret=${SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
server.port=${PORT:8080}
FRONTEND_URL=${FRONTEND}
